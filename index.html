<!DOCTYPE html>
<html lang="es">
<head>
    <title>Gestor de Proyectos</title>
</head>
<body>

<section id="project-management">
    <h2>Gestión de Proyectos</h2>

    <div id="proyectos-lista">
        <p>Cargando proyectos...</p>
    </div>

    <hr>
    
    <h3>Crear Nuevo Proyecto</h3>
    <input type="text" id="input-nombre-proyecto" placeholder="Nombre del nuevo proyecto">
    <button onclick="crearNuevoProyecto()">Crear Proyecto</button>
</section>

<h1 id="titulo-proyecto">Selecciona un Proyecto</h1>

<section>
    <h2>Agregar Tarea</h2>
    <input type="text" id="input-tarea" placeholder="Descripción de la tarea">
    <input type="text" id="input-responsable" placeholder="Responsable">
    <select id="input-prioridad">
        <option value="Baja">Baja</option>
        <option value="Media" selected>Media</option>
        <option value="Alta">Alta</option>
    </select>
    <button onclick="agregarTarea()">Agregar Tarea</button>
</section>

<section>
    <h2>Tabla de Avance</h2>
    <table id="tabla-avances">
        <thead>
            <tr>
                <th>Tarea</th>
                <th>Responsable</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Acciones</th> </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            </tbody>
    </table>
</section>

    <script src="script.js"></script> 

</body>
</html>
